    function renderStockCard(item) {
      var tracked = item.isStockTracked !== false;
      var hasOptions = !item.isChild && hasChildOptions(item.number);
      var hasPricedOptions = !item.isChild && hasPricedChildren(item.number);
      var displayStock = hasOptions ? getChildrenSum(item.number, 'stock') : Number(item.stock || 0);
      var displayAwaiting = hasOptions ? getChildrenSum(item.number, 'awaitingShipment') : Number(item.awaitingShipment || 0);
      var statusStock = getStatusStockValue(item, item);
      var statusClass = !tracked ? 'bg-slate-100 text-slate-500' : (statusStock <= 0 ? 'bg-red-100 text-red-700' : (statusStock <= Number(item.lowStock || 0) ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'));
      var status = !tracked ? '-' : (statusStock <= 0 ? 'หมดแล้ว' : (statusStock <= Number(item.lowStock || 0) ? 'ใกล้หมดแล้ว!' : 'มีของ'));
      var selectBox = stockSelectMode && !isShippingStockNumber(item.number) ? '<input type="checkbox" class="absolute top-3 right-3 accent-blue-700" data-number="' + escapeHtml(item.number) + '" ' + (selectedProducts.has(String(item.number)) ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleProductCheckbox(this)">' : '';
      var main = allStockData.find(function(row) { return String(row.number) === String(item.number); }) || {};
      var children = main.children || [];
      var pics = String(item.pictureUrl || '').split(',').map(function(url) { return url.trim(); }).filter(Boolean);
      var pictureHtml = pics.length
        ? '<div class="h-36 mb-3 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-center overflow-hidden"><img src="' + escapeHtml(getDirectImageUrl(pics[0])) + '" alt="' + escapeHtml(item.name) + '" class="h-full w-full object-contain p-2" onerror="this.style.display=\'none\'"></div>'
        : '<div class="h-36 mb-3 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-center text-slate-300"><i class="fa-solid fa-image text-3xl"></i></div>';
      var optionsHtml = '';
      if (children.length) {
        var expanded = stockGalleryExpanded[item.number] !== false;
        var optionRows = children.map(function(child) {
          var optionPrice = Number(child.price || 0) > 0 ? Number(child.price) : Number(item.price || 0);
          return '<button type="button" onclick="event.stopPropagation(); openProductDetail(\'' + escapeJs(child.number) + '\')" class="w-full flex items-center justify-between gap-2 py-2 border-b border-slate-100 text-left hover:bg-slate-50">' +
            '<span class="font-semibold text-sm text-slate-800">' + escapeHtml(child.choiceName || child.name || '-') + '</span>' +
            '<span class="flex items-center gap-2 text-xs">' +
              (optionPrice > 0 ? '<span class="rounded-full bg-blue-50 text-blue-700 px-2 py-1 font-bold">' + escapeHtml(optionPrice.toFixed(2)) + ' ฿</span>' : '') +
              (tracked ? '<span class="text-slate-600">คงเหลือ <b class="text-blue-700">' + escapeHtml(child.stock || 0) + '</b></span>' : '') +
            '</span>' +
          '</button>';
        }).join('');
        optionsHtml = '<div class="mt-3 border-t border-slate-100 pt-2">' +
          '<div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>ตัวเลือก</span><span>ราคา / สต็อก</span></div>' +
          '<div ' + (expanded ? '' : 'style="display:none"') + '>' + optionRows + '</div>' +
          '<button type="button" onclick="event.stopPropagation(); toggleStockGalleryChoices(\'' + escapeJs(item.number) + '\')" class="mt-2 px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-lg text-xs">' + (expanded ? 'ซ่อนตัวเลือก' : 'แสดงตัวเลือกทั้งหมด') + '</button>' +
        '</div>';
      }
      return '<div onclick="openProductDetail(\'' + escapeJs(item.number) + '\')" class="stock-card relative rounded-xl border border-slate-200 bg-white p-4 cursor-pointer">' +
        selectBox +
        pictureHtml +
        '<div class="flex items-start justify-between gap-3 mb-3">' +
          '<div><div class="font-mono text-xs text-slate-400">' + escapeHtml(item.number) + '</div><div class="font-bold text-slate-900">' + escapeHtml(item.productName || item.name) + '</div></div>' +
          '<span class="chip-nowrap px-2.5 py-1 rounded-full text-xs font-bold ' + statusClass + '">' + escapeHtml(status) + '</span>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-2 text-sm">' +
          '<div class="rounded-lg bg-slate-50 p-2"><div class="text-slate-400 text-xs">หมวดหมู่</div><b>' + escapeHtml(item.category || '-') + '</b></div>' +
          '<div class="rounded-lg bg-slate-50 p-2 text-right"><div class="text-slate-400 text-xs">ราคา</div><b>' + (hasPricedOptions ? '-' : escapeHtml(item.price || 0)) + '</b></div>' +
          '<div class="rounded-lg bg-slate-50 p-2 text-right"><div class="text-slate-400 text-xs">สต็อก</div><b class="' + (hasOptions ? 'text-slate-400' : 'text-blue-700') + '">' + (tracked ? escapeHtml(displayStock) : '-') + '</b></div>' +
          '<div class="rounded-lg bg-slate-50 p-2 text-right"><div class="text-slate-400 text-xs">Awaiting</div><b class="' + (displayAwaiting > 0 ? 'text-red-600' : 'text-blue-700') + '">' + (tracked ? escapeHtml(displayAwaiting) : '-') + '</b></div>' +
        '</div>' +
        optionsHtml +
      '</div>';
    }

    function toggleStockGalleryChoices(number) {
      stockGalleryExpanded[number] = stockGalleryExpanded[number] === false;
      renderStockTable();
    }

    function renderStockTableRow(item) {
      var dirty = !!stockRowDrafts[item.number];
      var draft = stockRowDrafts[item.number] || item;
      var tracked = item.isStockTracked !== false;
      var hasOptions = !item.isChild && hasChildOptions(item.number);
      var hasPricedOptions = !item.isChild && hasPricedChildren(item.number);
      var statusStock = getStatusStockValue(item, draft);
      var statusClass = !tracked ? 'bg-slate-100 text-slate-500' : (statusStock <= 0 ? 'bg-red-100 text-red-700' : (statusStock <= Number(draft.lowStock || 0) ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'));
      var status = !tracked ? '-' : (statusStock <= 0 ? 'หมดแล้ว' : (statusStock <= Number(draft.lowStock || 0) ? 'ใกล้หมดแล้ว!' : 'มีของ'));
      var displayStock = hasOptions ? getChildrenSum(item.number, 'stock') : Number(draft.stock || 0);
      var displayAwaiting = hasOptions ? getChildrenSum(item.number, 'awaitingShipment') : Number(draft.awaitingShipment || 0);
      var toggle = (!item.isChild && item.childCount > 0) ? '<button onclick="toggleStockChildren(\'' + escapeJs(item.number) + '\')" class="mr-2 w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600" title="ปิด-เปิดตัวเลือก">' + (collapsedStockGroups[item.number] ? '<i class="fa-solid fa-chevron-right"></i>' : '<i class="fa-solid fa-chevron-down"></i>') + '</button>' : '';
      var sortable = stockSortMode && !item.isChild && !isShippingStockNumber(item.number);
      var sortHandle = sortable ? '<span draggable="true" ondragstart="handleStockDragStart(event, \'' + escapeJs(item.number) + '\')" ondragend="handleStockDragEnd()" class="mr-2 inline-flex w-9 h-9 items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 cursor-grab" title="ลากเพื่อจัดเรียง"><i class="fa-solid fa-grip-vertical"></i></span>' : '';
      var selectBox = stockSelectMode && !isShippingStockNumber(item.number) ? '<input type="checkbox" class="mr-2 align-middle accent-blue-700" data-number="' + escapeHtml(item.number) + '" ' + (selectedProducts.has(String(item.number)) ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleProductCheckbox(this)">' : '';
      var dragAttrs = sortable ? ' data-number="' + escapeHtml(item.number) + '" ondragover="handleStockDragOver(event)" ondrop="handleStockDrop(event, \'' + escapeJs(item.number) + '\')"' : '';
      return '<tr id="stock-row-' + cssSafeId(item.number) + '" class="border-b border-slate-100 ' + (item.isChild ? 'stock-child-row ' : '') + (dirty ? 'stock-row-dirty ' : '') + (recentlySavedStockRows[item.number] ? 'stock-row-recent' : '') + '"' + dragAttrs + '>' +
        '<td class="p-3 text-slate-700 font-mono whitespace-nowrap">' + selectBox + escapeHtml(item.number) + '</td>' +
        '<td class="p-3 font-semibold ' + (item.isChild ? 'pl-8 text-sm text-slate-600' : 'text-slate-900') + '">' + (item.isChild ? '<span class="text-slate-400 mr-2">↳</span>' : sortHandle + toggle) + escapeHtml(item.name) + '</td>' +
        '<td class="p-3"><span class="chip-nowrap px-3 py-1 rounded-full text-xs font-bold ' + categoryBadgeClass(item.category) + '">' + escapeHtml(item.category || '-') + '</span></td>' +
        '<td class="p-3 text-right">' + (hasPricedOptions ? '<span class="text-slate-300">-</span>' : stockInlineInput(item.number, 'price', draft.price, '0.01')) + '</td>' +
        '<td class="p-3 text-right">' + (tracked ? (hasOptions ? readonlyStockValue(displayStock) : stockInlineInput(item.number, 'stock', draft.stock, '1')) : '<span class="text-slate-300">-</span>') + '</td>' +
        '<td class="p-3 text-right">' + (tracked ? stockInlineInput(item.number, 'lowStock', draft.lowStock, '1') : '<span class="text-slate-300">-</span>') + '</td>' +
        '<td class="p-3 text-right">' + (tracked ? (hasOptions ? readonlyStockValue(displayAwaiting, displayAwaiting > 0) : stockInlineInput(item.number, 'awaitingShipment', draft.awaitingShipment, '1')) : '<span class="text-slate-300">-</span>') + '</td>' +
        '<td class="p-3 text-center"><span class="chip-nowrap px-2.5 py-1 rounded-full text-xs font-bold ' + statusClass + '">' + escapeHtml(status) + '</span></td>' +
        '<td id="stock-actions-' + cssSafeId(item.number) + '" class="p-3 text-center whitespace-nowrap">' + renderStockRowActions(item.number, dirty) + '</td>' +
      '</tr>';
    }

    function isShippingStockNumber(number) {
      var value = String(number || '').trim();
      return value === '0' || value.indexOf('0.') === 0;
    }

    function hasPricedChildren(number) {
      var raw = getRawStockItemByNumber(number);
      var children = raw && raw.children ? raw.children : [];
      return children.some(function(child) { return Number(child.price || 0) > 0; });
    }

    function hasChildOptions(number) {
      var raw = getRawStockItemByNumber(number);
      return !!(raw && raw.children && raw.children.length);
    }

    function getTrackedChildren(number) {
      var raw = getRawStockItemByNumber(number);
      var children = raw && raw.children ? raw.children : [];
      return children.filter(function(child) { return child.isStockTracked !== false; });
    }

    function getChildrenSum(number, field) {
      return getTrackedChildren(number).reduce(function(sum, child) {
        return sum + Number(child[field] || 0);
      }, 0);
    }

    function getStatusStockValue(item, draft) {
      var children = item.isChild ? [] : getTrackedChildren(item.number);
      if (!children.length) return Number(draft.stock || 0);
      var total = children.reduce(function(sum, child) { return sum + Number(child.stock || 0); }, 0);
      return total / children.length;
    }

    function readonlyStockValue(value, isWarning) {
      return '<span class="stock-inline-readonly inline-flex w-[6.5rem] h-[2.1rem] items-center justify-end rounded-lg px-2 font-semibold ' + (isWarning ? 'text-red-600' : 'text-slate-400') + '">' + escapeHtml(value) + '</span>';
    }

    function categoryBadgeClass(category) {
      var key = String(category || '').trim();
      if (key === 'ทั่วไป') return 'bg-lime-100 text-lime-800';
      if (key === 'สื่อการสอน') return 'bg-sky-100 text-sky-800';
      if (key === 'ค่าส่ง') return 'bg-slate-100 text-slate-700';
      if (key === 'เครื่องเขียน') return 'bg-amber-100 text-amber-800';
      if (key === 'ครุภัณฑ์') return 'bg-violet-100 text-violet-800';
      var classes = ['bg-cyan-100 text-cyan-800','bg-rose-100 text-rose-800','bg-indigo-100 text-indigo-800','bg-emerald-100 text-emerald-800'];
      var hash = 0;
      for (var i = 0; i < key.length; i++) hash += key.charCodeAt(i);
      return classes[hash % classes.length];
    }

    function stockInlineInput(number, field, value, step) {
      var redClass = field === 'awaitingShipment' && Number(value || 0) > 0 ? ' text-red-600' : ' text-blue-700';
      return '<input type="number" step="' + step + '" value="' + escapeHtml(value) + '" data-number="' + escapeHtml(number) + '" data-field="' + field + '" oninput="markStockRowDirty(this)" onkeydown="handleStockInputKey(event)" class="stock-inline-input font-semibold' + redClass + '">';
    }

    function renderStockRowActions(number, dirty) {
      if (savingStockRows[number]) {
        return '<span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-blue-50 text-blue-700" title="กำลังบันทึก"><i class="fa-solid fa-circle-notch fa-spin"></i></span>';
      }
      if (dirty) {
        return '<button onclick="saveStockRow(\'' + escapeJs(number) + '\')" class="px-2.5 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-bold mr-1">บันทึก</button>' +
          '<button onclick="cancelStockRow(\'' + escapeJs(number) + '\')" class="px-2.5 py-1.5 rounded-lg bg-slate-200 text-slate-700 text-xs font-bold">ยกเลิก</button>';
      }
      return '<button onclick="openProductDetail(\'' + escapeJs(number) + '\')" class="w-11 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-purple-900 text-base transition" title="ดูรายละเอียด"><i class="fa-solid fa-eye"></i></button>';
    }

    function toggleStockChildren(number) {
      collapsedStockGroups[number] = !collapsedStockGroups[number];
      renderStockTable();
    }

    function toggleStockChildrenAll() {
      var hasOpen = allStockData.some(function(item) { return (item.children || []).length && !collapsedStockGroups[item.number]; });
      allStockData.forEach(function(item) {
        if ((item.children || []).length) collapsedStockGroups[item.number] = hasOpen;
      });
      renderStockTable();
    }

    function toggleStockSortMode() {
      if (stockSortSaving) return;
      if (stockSortMode) {
        cancelStockSortMode();
      } else {
        startStockSortMode();
      }
    }

    function startStockSortMode() {
      if (stockSortMode) return;
      stockSortMode = true;
      stockView = 'table';
      stockSortOriginalOrder = allStockData.map(function(item) { return String(item.number); });
      stockSelectMode = false;
      selectedProducts.clear();
      allStockData.forEach(function(item) {
        if ((item.children || []).length) collapsedStockGroups[item.number] = true;
      });
      var btn = document.getElementById('stock-sort-btn');
      if (btn) {
        btn.classList.add('bg-blue-700','text-white');
        btn.classList.remove('bg-slate-100','text-slate-700');
      }
      var actions = document.getElementById('stock-sort-actions');
      if (actions) {
        actions.classList.remove('hidden');
        actions.classList.add('flex');
      }
      renderStockTable();
    }

    function endStockSortMode() {
      stockSortMode = false;
      stockDragNumber = null;
      stockSortSaving = false;
      var btn = document.getElementById('stock-sort-btn');
      if (btn) {
        btn.classList.remove('bg-blue-700','text-white');
        btn.classList.add('bg-slate-100','text-slate-700');
      }
      var actions = document.getElementById('stock-sort-actions');
      if (actions) {
        actions.classList.add('hidden');
        actions.classList.remove('flex');
      }
      setStockSortSaveLoading(false);
    }

    function cancelStockSortMode() {
      if (stockSortOriginalOrder.length) {
        var orderMap = {};
        stockSortOriginalOrder.forEach(function(number, index) { orderMap[number] = index; });
        allStockData.sort(function(a, b) {
          var aOrder = orderMap.hasOwnProperty(String(a.number)) ? orderMap[String(a.number)] : 9999;
          var bOrder = orderMap.hasOwnProperty(String(b.number)) ? orderMap[String(b.number)] : 9999;
          return aOrder - bOrder;
        });
      }
      stockSortOriginalOrder = [];
      endStockSortMode();
      renderStockTable();
    }

    function moveStockGroupBefore(sourceNumber, targetNumber) {
      if (!sourceNumber || sourceNumber === targetNumber) return;
      var movable = allStockData.filter(function(item) { return !isShippingStockNumber(item.number); });
      var sourceItem = movable.find(function(item) { return String(item.number) === String(sourceNumber); });
      var targetItem = movable.find(function(item) { return String(item.number) === String(targetNumber); });
      if (!sourceItem || !targetItem) return;
      var sourceIndex = allStockData.indexOf(sourceItem);
      var targetIndex = allStockData.indexOf(targetItem);
      allStockData.splice(sourceIndex, 1);
      if (sourceIndex < targetIndex) targetIndex--;
      allStockData.splice(targetIndex, 0, sourceItem);
      renderStockTable();
    }

    function handleStockDragStart(event, number) {
      stockDragNumber = String(number);
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', stockDragNumber);
      var row = document.getElementById('stock-row-' + cssSafeId(number));
      if (row) row.classList.add('opacity-50');
    }

    function handleStockDragOver(event) {
      if (!stockSortMode || !stockDragNumber) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
    }

    function handleStockDrop(event, targetNumber) {
      event.preventDefault();
      var sourceNumber = event.dataTransfer.getData('text/plain') || stockDragNumber;
      moveStockGroupBefore(sourceNumber, targetNumber);
      stockDragNumber = null;
    }

    function handleStockDragEnd() {
      document.querySelectorAll('#stock-table-tbody tr.opacity-50').forEach(function(row) {
        row.classList.remove('opacity-50');
      });
    }

    function saveStockSortOrder() {
      if (stockSortSaving) return;
      var newOrder = allStockData
        .filter(function(item) { return !isShippingStockNumber(item.number); })
        .map(function(item) { return String(item.number); });
      if (!newOrder.length) return;
      stockSortSaving = true;
      setStockSortSaveLoading(true);
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.success === false) {
          stockSortSaving = false;
          setStockSortSaveLoading(false);
          alert(res.message || 'บันทึกลำดับไม่สำเร็จ');
          return;
        }
        stockSortOriginalOrder = [];
        endStockSortMode();
        loadStock();
      }).reorderProducts(newOrder);
    }

    function toggleStockSelectMode(btn) {
      if (stockSortMode) cancelStockSortMode();
      stockSelectMode = !stockSelectMode;
      if (!stockSelectMode) selectedProducts.clear();
      if (btn) {
        btn.classList.toggle('ring-2', stockSelectMode);
        btn.classList.toggle('ring-blue-700', stockSelectMode);
        btn.classList.toggle('bg-white', stockSelectMode);
      }
      renderStockTable();
    }

    function toggleProductCheckbox(checkbox) {
      var number = String(checkbox.getAttribute('data-number') || '');
      if (!number) return;
      if (checkbox.checked) selectedProducts.add(number);
      else selectedProducts.delete(number);
    }

    function setStockSortSaveLoading(isLoading) {
      var btn = document.getElementById('stock-sort-save-btn');
      if (!btn) return;
      btn.disabled = !!isLoading;
      btn.innerHTML = isLoading ? '<i class="fa-solid fa-circle-notch fa-spin"></i>' : '<i class="fa-solid fa-check"></i>';
    }

    function focusStockSearch() {
      var input = document.getElementById('stock-search-input');
      if (input) {
        input.focus();
        input.select();
      }
    }

    function markStockRowDirty(input) {
      var number = input.getAttribute('data-number');
      var base = stockRowDrafts[number] || getStockItemByNumber(number);
      if (!base) return;
      stockRowDrafts[number] = Object.assign({}, base, stockRowDrafts[number] || {});
      stockRowDrafts[number][input.getAttribute('data-field')] = Number(input.value || 0);
      if (input.getAttribute('data-field') === 'lowStock') syncVisibleChildLowStock(number, Number(input.value || 0));
      if (input.getAttribute('data-field') === 'awaitingShipment') {
        input.classList.toggle('text-red-600', Number(input.value || 0) > 0);
        input.classList.toggle('text-blue-700', Number(input.value || 0) <= 0);
      }
      var row = document.getElementById('stock-row-' + cssSafeId(number));
      if (row) {
        row.classList.add('stock-row-dirty');
        row.classList.remove('stock-row-recent');
      }
      delete recentlySavedStockRows[number];
      var actions = document.getElementById('stock-actions-' + cssSafeId(number));
      if (actions) actions.innerHTML = renderStockRowActions(number, true);
    }

    function syncVisibleChildLowStock(number, lowStock) {
      var raw = getRawStockItemByNumber(number);
      var children = raw && raw.children ? raw.children : [];
      children.forEach(function(child) {
        var input = Array.from(document.querySelectorAll('.stock-inline-input[data-field="lowStock"]')).find(function(el) {
          return el.getAttribute('data-number') === String(child.number);
        });
        if (input) input.value = lowStock;
      });
    }

    function saveStockRow(number, afterSave) {
      var draft = stockRowDrafts[number];
      var item = getStockItemByNumber(number);
      if (!draft || !item || savingStockRows[number]) return;
      var mainHasPricedOptions = !item.isChild && hasPricedChildren(number);
      var before = {
        price: mainHasPricedOptions ? undefined : Number(item.price || 0),
        lowStock: item.isStockTracked === false ? undefined : Number(item.lowStock || 0),
        stock: item.isStockTracked === false || mainHasPricedOptions ? undefined : Number(item.stock || 0),
        awaitingShipment: item.isStockTracked === false ? undefined : Number(item.awaitingShipment || 0)
      };
      var after = {
        price: mainHasPricedOptions ? undefined : Number(draft.price || 0),
        lowStock: item.isStockTracked === false ? undefined : Number(draft.lowStock || 0),
        stock: item.isStockTracked === false || mainHasPricedOptions ? undefined : Number(draft.stock || 0),
        awaitingShipment: item.isStockTracked === false ? undefined : Number(draft.awaitingShipment || 0)
      };
      savingStockRows[number] = true;
      var actions = document.getElementById('stock-actions-' + cssSafeId(number));
      if (actions) actions.innerHTML = renderStockRowActions(number, true);
      if (typeof afterSave === 'function') afterSave();
      google.script.run.withSuccessHandler(function(res) {
        delete savingStockRows[number];
        if (res && res.success === false) {
          var failedActions = document.getElementById('stock-actions-' + cssSafeId(number));
          if (failedActions) failedActions.innerHTML = renderStockRowActions(number, true);
          alert(res.message || 'บันทึกไม่สำเร็จ');
          return;
        }
        pushStockHistory(item._row, number, before, after);
        delete stockRowDrafts[number];
        applyStockValuesToLocalItem(number, after);
        recentlySavedStockRows[number] = true;
        var row = document.getElementById('stock-row-' + cssSafeId(number));
        if (row) {
          row.classList.remove('stock-row-dirty');
          row.classList.add('stock-row-recent');
        }
        var savedActions = document.getElementById('stock-actions-' + cssSafeId(number));
        if (savedActions) savedActions.innerHTML = renderStockRowActions(number, false);
      }).updateStockItem(item._row, after);
    }

    function applyStockValuesToLocalItem(number, values) {
      var item = getRawStockItemByNumber(number);
      if (!item) return;
      if (values.price !== undefined) item.price = values.price;
      if (values.lowStock !== undefined) item.lowStock = values.lowStock;
      if (values.stock !== undefined) item.stock = values.stock;
      if (values.awaitingShipment !== undefined) item.awaitingShipment = values.awaitingShipment;
      if (values.lowStock !== undefined && item.children && item.children.length) {
        item.children.forEach(function(child) {
          if (child.isStockTracked !== false) child.lowStock = values.lowStock;
        });
      }
    }

    function cancelStockRow(number) {
      delete stockRowDrafts[number];
      renderStockTable();
    }

    function pushStockHistory(rowIndex, number, before, after) {
      stockUndoStack.push({ rowIndex: rowIndex, number: number, before: before, after: after });
      if (stockUndoStack.length > 50) stockUndoStack.shift();
      stockRedoStack = [];
    }

    function applyStockHistory(entry, payload, done) {
      if (!entry) return;
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.success === false) {
          alert(res.message || 'ปรับกลับไม่สำเร็จ');
          return;
        }
        google.script.run.withSuccessHandler(function(data) {
          allStockData = data || [];
          renderStockCategoryChips();
          renderStockTable();
          if (typeof done === 'function') done();
        }).getStockData();
      }).updateStockItem(entry.rowIndex, payload);
    }

    function undoStockEdit() {
      var entry = stockUndoStack.pop();
      if (!entry) return;
      applyStockHistory(entry, entry.before, function() {
        stockRedoStack.push(entry);
      });
    }

    function redoStockEdit() {
      var entry = stockRedoStack.pop();
      if (!entry) return;
      applyStockHistory(entry, entry.after, function() {
        stockUndoStack.push(entry);
      });
    }

    function handleStockInputKey(event) {
      var key = event.key;
      if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(key)) return;
      var input = event.currentTarget;
      var number = input.getAttribute('data-number');
      var field = input.getAttribute('data-field');
      var inputs = Array.from(document.querySelectorAll('.stock-inline-input'));
      var currentIndex = inputs.indexOf(input);
      var sameRowInputs = inputs.filter(function(el) { return el.getAttribute('data-number') === number; });
      var rowIndex = sameRowInputs.indexOf(input);
      var target = null;

      if (key === 'Enter') {
        event.preventDefault();
        if (stockRowDrafts[number]) {
          var next = findVerticalStockInput(number, rowIndex, 1);
          if (next) {
            next.focus();
            next.select();
          }
          saveStockRow(number);
        } else {
          focusStockNeighbor(number, field, 1);
        }
        return;
      }

      if ((key === 'ArrowUp' || key === 'ArrowDown') && stockRowDrafts[number]) {
        event.preventDefault();
        alert('กรุณากด Enter เพื่อยืนยันการปรับก่อนเลื่อนไปแถวอื่น');
        return;
      }

      if (key === 'ArrowLeft') target = inputs[currentIndex - 1];
      if (key === 'ArrowRight') target = inputs[currentIndex + 1];
      if (key === 'ArrowUp') target = findVerticalStockInput(number, rowIndex, -1);
      if (key === 'ArrowDown') {
        var currentItem = getStockItemByNumber(number);
        if (currentItem && !currentItem.isChild && currentItem.childCount > 0 && collapsedStockGroups[number]) {
          event.preventDefault();
          collapsedStockGroups[number] = false;
          renderStockTable();
          target = findVerticalStockInput(number, rowIndex, 1);
          if (target) {
            target.focus();
            target.select();
          }
          return;
        }
        target = findVerticalStockInput(number, rowIndex, 1);
      }
      if (target) {
        event.preventDefault();
        target.focus();
        target.select();
      }
    }

    function findVerticalStockInput(number, columnIndex, direction) {
      var rows = Array.from(document.querySelectorAll('#stock-table-tbody tr'));
      var row = document.getElementById('stock-row-' + cssSafeId(number));
      var start = rows.indexOf(row);
      for (var i = start + direction; i >= 0 && i < rows.length; i += direction) {
        var candidates = rows[i].querySelectorAll('.stock-inline-input');
        if (candidates[columnIndex]) return candidates[columnIndex];
      }
      return null;
    }

    function focusStockNeighbor(number, field, direction) {
      var row = document.getElementById('stock-row-' + cssSafeId(number));
      if (!row) return;
      var inputs = Array.from(row.querySelectorAll('.stock-inline-input'));
      var columnIndex = inputs.findIndex(function(el) { return el.getAttribute('data-field') === field; });
      var target = findVerticalStockInput(number, Math.max(0, columnIndex), direction);
      if (target) {
        target.focus();
        target.select();
      }
    }

    function openProductDetail(number) {
      var item = getStockItemByNumber(number);
      if (!item) return;
      showProductDetail(item, false);
    }

    function openAddProduct() {
      newStockProductDraft = {
        number: '', productName: '', name: '', choiceName: '', category: '', productCode: '',
        price: 0, stock: 0, lowStock: 3, awaitingShipment: 0, pictureUrl: '',
        isChild: false, childCount: 0, isStockTracked: true
      };
      showProductDetail(newStockProductDraft, true);
    }

    function showProductDetail(item, isNew) {
      creatingNewStockProduct = !!isNew;
      selectedStockDetailNumber = isNew ? null : item.number;
      productDetailDirty = false;
      document.getElementById('product-detail-title').textContent = isNew ? 'เพิ่มสินค้าใหม่' : 'รายละเอียดสินค้า';
      var pics = item.pictureUrl ? item.pictureUrl.split(',').map(function(u){ return u.trim(); }).filter(Boolean) : [];
      var firstPic = pics.length ? getDirectImageUrl(pics[0]) : '';
      var imageHtml = firstPic ? '<img src="' + escapeHtml(firstPic) + '" class="max-h-80 mx-auto object-contain rounded-xl border border-slate-200 bg-slate-50">' : '<div class="h-44 rounded-xl bg-slate-100 flex items-center justify-center text-slate-300"><i class="fa-solid fa-image text-4xl"></i></div>';
      var hasOptions = !item.isChild && hasChildOptions(item.number);
      var mainHasPricedOptions = !item.isChild && hasPricedChildren(item.number);
      var productFieldClass = hasOptions || isNew ? 'md:col-span-2' : '';
      document.getElementById('product-detail-content').innerHTML =
        '<div class="space-y-5">' +
          imageHtml +
          '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
            detailField('ชื่อสินค้า (Product)', 'detail-productName', item.productName || item.name, 'text', productFieldClass) +
            (hasOptions || isNew ? '' : detailField('ตัวเลือก (Choice)', 'detail-choiceName', item.choiceName, 'text')) +
            detailField('หมวดหมู่ (Category)', 'detail-category', item.category, 'text') +
            detailField('รหัสสินค้า', 'detail-productCode', item.productCode, 'text') +
            (mainHasPricedOptions ? '' : detailField('ราคา', 'detail-price', item.price, 'number')) +
            (item.isStockTracked === false ? '' : detailField('Low Stock', 'detail-lowStock', item.lowStock, 'number')) +
            (item.isStockTracked === false ? '' : (hasOptions ? detailReadonlyField('Available Stock', getChildrenSum(item.number, 'stock')) : detailField('Available Stock', 'detail-stock', item.stock, 'number'))) +
            (item.isStockTracked === false ? '' : (hasOptions ? detailReadonlyField('Awaiting Shipment', getChildrenSum(item.number, 'awaitingShipment')) : detailField('Awaiting Shipment', 'detail-awaiting', item.awaitingShipment, 'number'))) +
          '</div>' +
          '<label class="block text-sm font-bold text-slate-500">รูปภาพ (หลายลิงก์คั่นด้วย ,)</label>' +
          '<textarea id="detail-pictureUrl" oninput="markProductDetailDirty()" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm min-h-[88px]">' + escapeHtml(item.pictureUrl || '') + '</textarea>' +
          renderProductChoicesSection(item) +
        '</div>';
      document.getElementById('save-product-detail-btn').onclick = function() { saveProductDetail(); };
      document.getElementById('product-detail-modal').classList.remove('hidden');
    }

    function detailField(label, id, value, type, extraClass) {
      var inputHandler = id === 'detail-lowStock' ? 'markProductDetailDirty(); syncDetailChoiceLowStock(this.value)' : 'markProductDetailDirty()';
      return '<label class="block ' + escapeHtml(extraClass || '') + '"><span class="block text-sm font-bold text-slate-500 mb-1">' + escapeHtml(label) + '</span>' +
        '<input id="' + id + '" type="' + type + '" value="' + escapeHtml(value === null || value === undefined ? '' : value) + '" oninput="' + inputHandler + '" class="w-full border border-transparent bg-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-600 focus:bg-white"></label>';
    }

    function detailReadonlyField(label, value) {
      return '<label class="block"><span class="block text-sm font-bold text-slate-500 mb-1">' + escapeHtml(label) + '</span>' +
        '<div class="w-full border border-transparent bg-slate-100 text-blue-700 font-semibold rounded-xl px-3 py-2 text-sm">' + escapeHtml(value) + '</div></label>';
    }

    function syncDetailChoiceLowStock(value) {
      document.querySelectorAll('#detail-choices-list .detail-choice-row').forEach(function(row) {
        var inputs = row.querySelectorAll('input');
        if (inputs[3]) inputs[3].value = Number(value || 0);
      });
    }

    function renderProductChoicesSection(item) {
      if (item.isChild || item.isStockTracked === false) return '';
      var main = allStockData.find(function(row) { return String(row.number) === String(item.number); });
      var children = (main && main.children) ? main.children : [];
      var rows = children.map(function(child) {
        return renderProductChoiceRow(child.number, child.choiceName || child.name || '', child.price || '', child.stock || 0, child.lowStock || 0, child.productCode || '', false);
      }).join('');
      return '<div class="pt-2">' +
        '<div class="text-sm font-bold text-slate-600 mb-2">ตัวเลือก (Choices) และสต็อก</div>' +
        '<div id="detail-choices-list" class="space-y-2">' + rows + '</div>' +
        '<button type="button" onclick="addProductChoiceRow()" class="mt-2 text-blue-700 text-sm font-semibold hover:underline"><i class="fa-solid fa-plus mr-1"></i>เพิ่มตัวเลือก</button>' +
      '</div>';
    }

    function renderProductChoiceRow(number, name, price, stock, lowStock, productCode, isNew) {
      return '<div class="detail-choice-row grid grid-cols-12 gap-2 items-center" ondragover="handleChoiceDragOver(event)" ondrop="handleChoiceDrop(event, this)" data-number="' + escapeHtml(number || '') + '" data-new="' + (isNew ? 'true' : 'false') + '">' +
        '<div class="col-span-12 sm:col-span-1 flex justify-center">' +
          '<span draggable="true" ondragstart="handleChoiceDragStart(event, this)" ondragend="handleChoiceDragEnd()" class="inline-flex w-9 h-9 items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 cursor-grab" title="ลากเพื่อจัดเรียง"><i class="fa-solid fa-grip-vertical"></i></span>' +
        '</div>' +
        '<input type="text" value="' + escapeHtml(name || '') + '" placeholder="ชื่อตัวเลือก" oninput="markProductDetailDirty()" class="col-span-12 sm:col-span-3 bg-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-100">' +
        '<input type="number" value="' + escapeHtml(price || '') + '" placeholder="ราคา" oninput="markProductDetailDirty()" class="col-span-4 sm:col-span-2 bg-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-100">' +
        '<input type="number" value="' + escapeHtml(stock || 0) + '" placeholder="สต็อก" oninput="markProductDetailDirty()" class="col-span-4 sm:col-span-2 bg-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-100">' +
        '<input type="number" value="' + escapeHtml(lowStock || 0) + '" placeholder="Low" oninput="markProductDetailDirty()" class="col-span-4 sm:col-span-2 bg-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-100">' +
        '<input type="text" value="' + escapeHtml(productCode || '') + '" placeholder="รหัส" oninput="markProductDetailDirty()" class="col-span-10 sm:col-span-1 bg-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-100">' +
        '<button type="button" onclick="removeProductChoiceRow(this)" class="col-span-2 sm:col-span-1 text-red-500 hover:text-red-700"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>';
    }

    var choiceDragRow = null;

    function handleChoiceDragStart(event, row) {
      choiceDragRow = row.closest('.detail-choice-row');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', choiceDragRow ? choiceDragRow.getAttribute('data-number') || 'new' : '');
      if (choiceDragRow) choiceDragRow.classList.add('opacity-50');
    }

    function handleChoiceDragOver(event) {
      if (!choiceDragRow) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
    }

    function handleChoiceDrop(event, targetRow) {
      event.preventDefault();
      var list = document.getElementById('detail-choices-list');
      if (!choiceDragRow || !targetRow || !list || choiceDragRow === targetRow) return;
      var rows = Array.from(list.querySelectorAll('.detail-choice-row'));
      var sourceIndex = rows.indexOf(choiceDragRow);
      var targetIndex = rows.indexOf(targetRow);
      if (sourceIndex < targetIndex) list.insertBefore(choiceDragRow, targetRow.nextSibling);
      else list.insertBefore(choiceDragRow, targetRow);
      markProductDetailDirty();
    }

    function handleChoiceDragEnd() {
      if (choiceDragRow) choiceDragRow.classList.remove('opacity-50');
      choiceDragRow = null;
    }

    function addProductChoiceRow() {
      var list = document.getElementById('detail-choices-list');
      if (!list) return;
      list.insertAdjacentHTML('beforeend', renderProductChoiceRow('', '', '', 0, Number(document.getElementById('detail-lowStock')?.value || 0), '', true));
      markProductDetailDirty();
    }

    function removeProductChoiceRow(btn) {
      var row = btn.closest('.detail-choice-row');
      if (!row) return;
      if (row.getAttribute('data-new') === 'true') {
        row.remove();
      } else {
        row.setAttribute('data-delete', 'true');
        row.classList.add('opacity-40');
        row.style.display = 'none';
      }
      markProductDetailDirty();
    }

    function markProductDetailDirty() {
      productDetailDirty = true;
    }

    function tryCloseProductDetail() {
      if (productDetailDirty) {
        scrollProductDetailToActions();
        return;
      }
      closeProductDetail();
    }

    function handleProductDetailBackdropClick(event) {
      if (event.target && event.target.id === 'product-detail-modal') tryCloseProductDetail();
    }

    function scrollProductDetailToActions() {
      var panel = document.querySelector('#product-detail-modal > div');
      if (panel) panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' });
    }

    function closeProductDetail() {
      document.getElementById('product-detail-modal').classList.add('hidden');
      selectedStockDetailNumber = null;
      productDetailDirty = false;
      creatingNewStockProduct = false;
      newStockProductDraft = null;
    }

    function cancelProductDetail() {
      closeProductDetail();
    }

    function saveProductDetail() {
      var isNew = creatingNewStockProduct;
      var item = isNew ? newStockProductDraft : getStockItemByNumber(selectedStockDetailNumber);
      if (!item) return;
      var saveBtn = document.getElementById('save-product-detail-btn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i>กำลังบันทึก';
      }
      var mainHasPricedOptions = !isNew && !item.isChild && hasPricedChildren(item.number);
      var payload = {
        productName: document.getElementById('detail-productName').value,
        choiceName: document.getElementById('detail-choiceName') ? document.getElementById('detail-choiceName').value : undefined,
        category: document.getElementById('detail-category').value,
        productCode: document.getElementById('detail-productCode').value,
        price: mainHasPricedOptions ? undefined : Number(document.getElementById('detail-price').value || 0),
        lowStock: item.isStockTracked === false ? undefined : Number(document.getElementById('detail-lowStock').value || 0),
        stock: item.isStockTracked === false || hasChildOptions(item.number) ? undefined : Number(document.getElementById('detail-stock').value || 0),
        awaitingShipment: item.isStockTracked === false || hasChildOptions(item.number) ? undefined : Number(document.getElementById('detail-awaiting').value || 0),
        pictureUrl: document.getElementById('detail-pictureUrl').value
      };
      if (isNew) {
        if (!String(payload.productName || '').trim()) {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>บันทึก';
          }
          alert('กรุณากรอกชื่อสินค้า');
          document.getElementById('detail-productName').focus();
          return;
        }
        saveNewProductDetail(payload, saveBtn);
        return;
      }
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.success === false) {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>บันทึก';
          }
          alert(res.message || 'บันทึกไม่สำเร็จ');
          return;
        }
        saveProductChoiceChanges(item, function() {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>บันทึก';
          }
          closeProductDetail();
          loadStock();
        });
      }).updateStockItem(item._row, payload);
    }

    function restoreProductDetailSaveButton(saveBtn) {
      if (!saveBtn) return;
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>บันทึก';
    }

    function saveNewProductDetail(payload, saveBtn) {
      var choices = collectProductChoiceChanges().filter(function(change) {
        return !change.shouldDelete && change.choiceName;
      }).map(function(change) {
        return {
          choiceName: change.choiceName,
          price: change.price,
          stock: change.stock,
          lowStock: change.lowStock,
          productCode: change.productCode
        };
      });
      payload.choices = choices;
      if (choices.length) {
        payload.stock = 0;
        payload.awaitingShipment = 0;
      }
      function fail(error) {
        restoreProductDetailSaveButton(saveBtn);
        alert((error && error.message) || 'เพิ่มสินค้าไม่สำเร็จ');
      }
      google.script.run.withSuccessHandler(function(res) {
        if (!res || res.success === false || res.number === undefined) {
          fail(new Error((res && res.message) || 'เพิ่มสินค้าไม่สำเร็จ'));
          return;
        }
        restoreProductDetailSaveButton(saveBtn);
        var addedNumber = String(res.number);
        closeProductDetail();
        var searchInput = document.getElementById('stock-search-input');
        if (searchInput) searchInput.value = '';
        loadStock(function() {
          var addedRow = document.getElementById('stock-row-' + cssSafeId(addedNumber));
          if (addedRow) addedRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          else alert('บันทึกสินค้าแล้ว แต่ไม่พบแถวสินค้า #' + addedNumber + ' หลังโหลดใหม่');
        }, function(error) {
          alert('บันทึกสินค้าแล้ว แต่โหลดรายการกลับมาไม่สำเร็จ: ' + (error && error.message ? error.message : error));
        });
      }).withFailureHandler(fail).addProduct(payload);
    }

    function collectProductChoiceChanges() {
      var rows = Array.from(document.querySelectorAll('#detail-choices-list .detail-choice-row'));
      return rows.map(function(row) {
        var inputs = row.querySelectorAll('input');
        return {
          number: row.getAttribute('data-number') || '',
          isNew: row.getAttribute('data-new') === 'true',
          shouldDelete: row.getAttribute('data-delete') === 'true',
          choiceName: inputs[0] ? inputs[0].value.trim() : '',
          price: inputs[1] && inputs[1].value.trim() !== '' ? Number(inputs[1].value) : '',
          stock: inputs[2] ? Number(inputs[2].value || 0) : 0,
          lowStock: inputs[3] ? Number(inputs[3].value || 0) : 0,
          productCode: inputs[4] ? inputs[4].value.trim() : ''
        };
      });
    }

    function saveProductChoiceChanges(mainItem, done) {
      if (!mainItem || mainItem.isChild || mainItem.isStockTracked === false) {
        done();
        return;
      }
      var changes = collectProductChoiceChanges().filter(function(change) {
        return change.shouldDelete || change.choiceName;
      });
      var childOrder = collectProductChoiceChanges()
        .filter(function(change) { return !change.shouldDelete && !change.isNew && change.number; })
        .map(function(change) { return change.number; });
      var mainLowStockInput = document.getElementById('detail-lowStock');
      var mainLowStock = mainLowStockInput ? Number(mainLowStockInput.value || 0) : null;
      var index = 0;
      function finish() {
        if (childOrder.length) {
          google.script.run.withSuccessHandler(done).reorderVariants(mainItem.number, childOrder);
        } else {
          done();
        }
      }
      function next() {
        if (index >= changes.length) {
          finish();
          return;
        }
        var change = changes[index++];
        if (change.shouldDelete && change.number) {
          google.script.run.withSuccessHandler(next).deleteProduct(change.number);
          return;
        }
        if (change.isNew) {
          google.script.run.withSuccessHandler(next).addVariant(mainItem.number, change.choiceName, change.price, change.stock, mainLowStock !== null ? mainLowStock : change.lowStock, change.productCode);
          return;
        }
        var child = getStockItemByNumber(change.number);
        if (!child) {
          next();
          return;
        }
        google.script.run.withSuccessHandler(next).updateStockItem(child._row, {
          choiceName: change.choiceName,
          price: change.price,
          stock: change.stock,
          lowStock: mainLowStock !== null ? mainLowStock : change.lowStock,
          productCode: change.productCode
        });
      }
      next();
    }

    function addVariantRow(btn) {
      var container = btn.parentElement;
      var div = document.createElement('div');
      div.className = 'flex items-center gap-2 mt-2';
      div.innerHTML = '<input type="text" placeholder="ชื่อตัวเลือก" class="flex-1 border rounded px-2 py-1 text-xs">' +
        '<input type="number" placeholder="ราคา" class="w-20 border rounded px-2 py-1 text-xs">' +
        '<button onclick="this.parentElement.remove()" class="text-red-500"><i class="fa-solid fa-times"></i></button>';
      container.insertBefore(div, btn);
    }

    function deleteVariant(variantId) {
      if (confirm('ลบตัวเลือกนี้?')) {
        google.script.run.withSuccessHandler(function() {
          loadStock();
        }).deleteProduct(variantId);
      }
    }

    // ---- Initial Load ----
    loadOrders();
  </script>
</body>
</html>
