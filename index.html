<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Talent - Admin</title>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    if (location.protocol === 'file:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
      document.write('<script src="local-preview.js"><\/script>');
    }
  </script>
  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxhxlNHYpzJkfoaiTx6ast3A5g3QZWbDM3yBgBBjpPcmbFq0wna9frH5aueTnmbFxDP/exec';

    function installGasFetchBridge() {
      if (typeof google !== 'undefined' && google.script && google.script.run) return;
      function makeRunner(successHandler, failureHandler) {
        return new Proxy({}, {
          get: function(_, method) {
            if (method === 'withSuccessHandler') return function(handler) { return makeRunner(handler, failureHandler); };
            if (method === 'withFailureHandler') return function(handler) { return makeRunner(successHandler, handler); };
            return function() {
              var args = Array.prototype.slice.call(arguments);
              fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: String(method), args: args }),
                cache: 'no-store'
              }).then(function(res) {
                return res.json().then(function(data) {
                  if (!res.ok || (data && data.success === false)) throw new Error((data && data.message) || ('GAS ตอบกลับ HTTP ' + res.status));
                  return data;
                });
              }).then(function(data) {
                if (typeof successHandler === 'function') successHandler(data);
              }).catch(function(error) {
                if (typeof failureHandler === 'function') failureHandler(error);
                else alert('เชื่อมต่อ GAS ไม่สำเร็จ: ' + error.message);
              });
            };
          }
        });
      }
      window.google = { script: { run: makeRunner(null, null) } };
    }
    installGasFetchBridge();
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active { background-color: #1e40af; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* card grid for stock */
    .stock-card {
      transition: all 0.2s ease;
    }
    .stock-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }
    .status-pill {
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stock-inline-input {
      width: 6.5rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      padding: 0.25rem 0.5rem;
      text-align: right;
      background: transparent;
      outline: none;
    }
    .stock-inline-input:focus {
      border-color: #93c5fd;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
    }
    .stock-row-dirty {
      background: #fff7ed;
    }
    .stock-row-recent {
      background: #fef9c3;
    }
    .stock-child-row {
      background: #f8fafc;
      color: #475569;
    }
    .stock-child-row td {
      padding-top: 0.45rem;
      padding-bottom: 0.45rem;
    }
    .stock-child-row .stock-inline-input {
      padding-top: 0.15rem;
      padding-bottom: 0.15rem;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: 2.25rem;
      height: 2.25rem;
      max-width: 2.25rem;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: middle;
      transition: max-width 0.22s ease, padding 0.22s ease, background-color 0.2s ease;
    }
    .action-btn + .action-btn {
      margin-left: 0.25rem;
    }
    .detail-actions .action-btn {
      width: auto;
      max-width: none;
      padding-left: 0.75rem;
      padding-right: 0.75rem;
    }
    .action-btn .action-label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.22s ease, opacity 0.16s ease;
    }
    .detail-actions .action-label {
      max-width: none;
      opacity: 1;
    }
    .chip-nowrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
    }
  </style>
</head>
<body class="p-3 sm:p-6 min-h-screen flex justify-center items-start">
  <div class="max-w-7xl w-full bg-white rounded-2xl shadow-xl p-4 sm:p-8 border border-slate-200">

    <!-- Header -->

  <!-- Tracking Modal -->

          <button type="button" onclick="selectCarrier('Grab Express')" data-carrier="Grab Express" class="carrier-chip px-3 py-1.5 rounded-full border border-slate-300 text-slate-600 text-xs font-bold hover:border-blue-500 hover:text-blue-700 transition">Grab Express</button>

        <h3 id="product-detail-title" class="text-lg font-bold text-blue-950">รายละเอียดสินค้า</h3>

        <button onclick="cancelProductDetail()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">ยกเลิก</button>

  <script>
    // ---- Tab Switching ----
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active','bg-blue-900','text-white'));
      document.getElementById('tab-'+tab).classList.add('active');
      event.target.classList.add('active','bg-blue-900','text-white');
      if (tab === 'orders') loadOrders();
      else if (tab === 'stock') loadStock();
    }

    function openOrderPage() {
      window.open(GAS_API_URL, '_blank', 'noopener');
    }

    function openAssetsPage() {
      window.location.href = 'assets.html';
    }

    function showStockCheckBanner(html, tone) {
      var banner = document.getElementById('stock-check-banner');
      banner.className = 'mb-5 rounded-xl border px-4 py-3 text-sm ' + (tone === 'ok' ? 'border-emerald-200 bg-emerald-50 text-emerald-900' : 'border-blue-200 bg-blue-50 text-blue-900');
      banner.innerHTML = html;
      banner.classList.remove('hidden');
    }

    function checkStockUpdate() {
      var btn = document.getElementById('stock-check-btn');
      var original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังเช็ก...';
      google.script.run.withSuccessHandler(function(data) {
        allStockData = data || [];
        recentlySavedStockRows = {};
        var awaiting = 0;
        var lowStock = 0;
        var outStock = 0;
        for (var i = 0; i < allStockData.length; i++) {
          var item = allStockData[i];
          if (item.isStockTracked !== false) {
            awaiting += Number(item.awaitingShipment || 0);
            if (Number(item.stock || 0) <= 0) outStock++;
            else if (Number(item.stock || 0) <= Number(item.lowStock || 0)) lowStock++;
          }
          var children = item.children || [];
          for (var j = 0; j < children.length; j++) {
            if (children[j].isStockTracked === false) continue;
            awaiting += Number(children[j].awaitingShipment || 0);
            if (Number(children[j].stock || 0) <= 0) outStock++;
            else if (Number(children[j].stock || 0) <= Number(children[j].lowStock || 0)) lowStock++;
          }
        }
        var now = new Date().toLocaleString('th-TH', { hour12: false });
        showStockCheckBanner(
          '<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">' +
            '<div><b><i class="fa-solid fa-store mr-1"></i> เช็กสต็อกล่าสุด:</b> ' + escapeHtml(now) + '</div>' +
            '<div class="flex flex-wrap gap-2 text-xs font-bold">' +
              '<span class="px-2 py-1 rounded-full bg-blue-100 text-blue-700">รอจัดส่ง ' + awaiting + ' ชิ้น</span>' +
              '<span class="px-2 py-1 rounded-full bg-amber-100 text-amber-700">ใกล้หมด ' + lowStock + ' รายการ</span>' +
              '<span class="px-2 py-1 rounded-full bg-red-100 text-red-700">หมดแล้ว ' + outStock + ' รายการ</span>' +
            '</div>' +
          '</div>',
          'ok'
        );
        if (document.getElementById('tab-stock').classList.contains('active')) renderStockTable();
        btn.disabled = false;
        btn.innerHTML = original;
      }).getStockData();
    }

    // ---- Utility ----
    function getDirectImageUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        var idMatch = url.match(/\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/) || url.match(/[-\w]{25,}/);
        var id = idMatch ? idMatch[1] || idMatch[0] : '';
        if (id) return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000';
      }
      if (url.includes('drive.google.com/file/d/')) {
        var match = url.match(/\/d\/([^/]+)/);
        if (match) return 'https://drive.google.com/uc?export=view&id=' + match[1];
      }
      if (url.includes('drive.google.com/open?id=')) {
        var match = url.match(/id=([^&]+)/);
        if (match) return 'https://drive.google.com/uc?export=view&id=' + match[1];
      }
      return url;
    }

    function formatDate(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      if (isNaN(d.getTime())) return ts;
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var dd = String(d.getDate()).padStart(2,'0');
      var hh = String(d.getHours()).padStart(2,'0');
      var min = String(d.getMinutes()).padStart(2,'0');
      var ss = String(d.getSeconds()).padStart(2,'0');
      return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + min + ':' + ss;
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function(ch) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
      });
    }

    function escapeJs(value) {
      return String(value === null || value === undefined ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function cssSafeId(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    document.addEventListener('keydown', function(event) {
      var key = String(event.key || '').toLowerCase();
      if (!event.ctrlKey || event.altKey || event.metaKey || key !== 'z') return;
      var tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
      if ((tag === 'input' || tag === 'textarea') && !(event.target.classList && event.target.classList.contains('stock-inline-input'))) return;
      if (event.target.classList && event.target.classList.contains('stock-inline-input') && stockRowDrafts[event.target.getAttribute('data-number')]) return;
      event.preventDefault();
      if (event.shiftKey) redoStockEdit();
      else undoStockEdit();
    });

    function parseOrderItems(itemsText) {
      if (!itemsText) return [];
      try {
        var jsonItems = JSON.parse(itemsText);
        if (Array.isArray(jsonItems)) {
          return jsonItems.map(function(item) {
            return {
              number: String(item.number || '').trim(),
              name: String(item.name || '').trim(),
              productName: String(item.productName || '').trim(),
              quantity: Number(item.quantity || 0),
              price: Number(item.price || 0),
              subtotal: Number(item.subtotal || 0)
            };
          });
        }
      } catch(e) {}
      var parts = String(itemsText).split(' | ');
      var items = [];
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        var match = part.match(/(?:\[([^\]]+)\]\s*)?(.+?)\s+x(\d+)\s+\(([\d.]+)\s*THB\)/);
        if (!match) {
          items.push({ number: '', name: part, quantity: '', price: 0, subtotal: 0 });
          continue;
        }
        var qty = Number(match[3] || 0);
        var subtotal = Number(match[4] || 0);
        items.push({
          number: String(match[1] || '').trim(),
          name: String(match[2] || '').trim(),
          quantity: qty,
          price: qty ? subtotal / qty : 0,
          subtotal: subtotal
        });
      }
      return items;
    }

    function getStockLookup(number) {
      if (!number || !allStockData || !allStockData.length) return null;
      for (var i = 0; i < allStockData.length; i++) {
        var main = allStockData[i];
        if (String(main.number) === String(number) || String(main.pageId) === String(number)) return main;
        var children = main.children || [];
        for (var j = 0; j < children.length; j++) {
          var child = children[j];
          if (String(child.number) === String(number) || String(child.pageId) === String(number)) return child;
        }
      }
      return null;
    }

    function resolveOrderItemName(item) {
      var number = String(item.number || '').trim();
      var itemName = String(item.name || '').trim();
      var stockItem = getStockLookup(number);
      if (number.indexOf('0.') === 0 || itemName === 'ค่าส่ง') {
        var shippingChoice = (stockItem && stockItem.choiceName) || itemName;
        return shippingChoice && shippingChoice !== 'ค่าส่ง' ? 'ค่าส่ง - ' + shippingChoice : 'ค่าส่ง';
      }

      var parentItem = number.indexOf('.') !== -1 ? getStockLookup(number.split('.')[0]) : null;
      var productName = item.productName ||
        (stockItem && (stockItem.productName || (!stockItem.choiceName ? stockItem.name : ''))) ||
        (parentItem && (parentItem.productName || parentItem.name)) || '';
      var choiceName = (stockItem && stockItem.choiceName) ||
        (number.indexOf('.') !== -1 && itemName !== productName ? itemName : '');
      if (productName && choiceName && choiceName !== productName) return productName + ' - ' + choiceName;
      return productName || itemName || '-';
    }

    function renderOrderItems(itemsText) {
      var items = parseOrderItems(itemsText);
      if (!items.length) return '<span class="text-slate-400">-</span>';
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var fullName = resolveOrderItemName(item);
        html += '<div class="mb-1.5 last:mb-0">' +
          '<div class="font-semibold text-slate-800 text-xs">' + escapeHtml(fullName) + ' <span class="text-slate-500">x' + escapeHtml(item.quantity) + '</span></div>' +
        '</div>';
      }
      return html;
    }

    // ==================== ORDERS ====================
    var currentOrderIdForTracking = null;
    var selectedCarrierForTracking = '';
    var allOrdersData = [];
    var currentOrderPage = 1;
    var orderPageSize = 10;
    var html5QrCode = null;

    function loadOrders() {
      google.script.run.withSuccessHandler(function(stockData) {
        allStockData = stockData || [];
        google.script.run.withSuccessHandler(function(orders) {
          currentOrderPage = 1;
          renderOrders(orders);
        }).getOrders();
      }).getStockData();
    }

    function renderOrderActions(order) {
      var orderId = order['Order ID'];
      var status = order['Status'] || 'รอการยืนยัน';
      var receiptBtn = renderActionButton('generateReceiptExcel(\'' + orderId + '\')', 'fa-file-excel', 'ออกใบเสร็จ', 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100');
      if (status === 'รอการยืนยัน') {
        return receiptBtn +
          renderActionButton('confirmOrder(\'' + orderId + '\')', 'fa-check', 'ยืนยัน & ตัดสต็อก', 'bg-emerald-500 text-white hover:bg-emerald-600') +
          renderActionButton('cancelOrder(\'' + orderId + '\')', 'fa-xmark', 'ยกเลิก', 'bg-red-500 text-white hover:bg-red-600');
      }
      if (status === 'ตัดสต็อกแล้ว (รอส่ง)') {
        return receiptBtn +
          renderActionButton('openTrackingModal(\'' + orderId + '\')', 'fa-truck-fast', 'แจ้งจัดส่ง', 'bg-blue-500 text-white hover:bg-blue-600') +
          renderActionButton('cancelRestock(\'' + orderId + '\')', 'fa-rotate-left', 'ยกเลิก & คืนสต็อก', 'bg-red-500 text-white hover:bg-red-600');
      }
      if (status === 'จัดส่งแล้ว') {
        return receiptBtn +
          renderActionButton('completeOrder(\'' + orderId + '\')', 'fa-flag-checkered', 'เสร็จสิ้น', 'bg-blue-500 text-white hover:bg-blue-600') +
          renderActionButton('returnRestock(\'' + orderId + '\')', 'fa-arrow-rotate-left', 'ตีกลับ/คืนสต็อก', 'bg-amber-500 text-white hover:bg-amber-600');
      }
      return receiptBtn;
    }

    function renderActionButton(action, icon, label, colorClass) {
      return '<button onclick="event.stopPropagation(); ' + action + '" class="action-btn rounded-lg text-xs font-bold ' + colorClass + '" title="' + escapeHtml(label) + '">' +
        '<i class="fa-solid ' + icon + '"></i><span class="action-label">' + escapeHtml(label) + '</span>' +
      '</button>';
    }

    function renderOrders(orders) {
      allOrdersData = orders || [];
      var tbody = document.getElementById('orders-tbody');
      var term = (document.getElementById('orders-search-input')?.value || '').trim().toLowerCase();
      var filteredOrders = allOrdersData.filter(function(order) {
        if (!term) return true;
        var items = parseOrderItems(order['Items']).map(function(item) {
          return resolveOrderItemName(item) + ' ' + (item.quantity || '');
        }).join(' ');
        return [
          order['Order ID'], order['Timestamp'], order['Branch'], order['CustomerName'],
          order['Phone'], order['Email'], order['Status'], order['Tracking'],
          order['Shipping Carrier'], items
        ].join(' ').toLowerCase().indexOf(term) !== -1;
      });
      filteredOrders.sort(compareOrdersNewestFirst);
      if (!filteredOrders.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-400">ไม่มีข้อมูลคำสั่งซื้อ</td></tr>';
        renderOrdersPagination(0, 0, 0);
        return;
      }
      var pending = filteredOrders.filter(function(order) { return isOrderInProgress(order['Status']); });
      var finished = filteredOrders.filter(function(order) { return !isOrderInProgress(order['Status']); });
      var firstFinishedCount = Math.max(0, orderPageSize - pending.length);
      var remainingFinished = Math.max(0, finished.length - firstFinishedCount);
      var totalPages = Math.max(1, 1 + Math.ceil(remainingFinished / orderPageSize));
      if (currentOrderPage > totalPages) currentOrderPage = totalPages;
      var visibleOrders;
      if (currentOrderPage === 1) {
        visibleOrders = pending.concat(finished.slice(0, firstFinishedCount));
      } else {
        var start = firstFinishedCount + ((currentOrderPage - 2) * orderPageSize);
        visibleOrders = finished.slice(start, start + orderPageSize);
      }
      var html = '';
      for (var i = 0; i < visibleOrders.length; i++) {
        var o = visibleOrders[i];
        var status = o['Status'] || 'รอการยืนยัน';
        var tracking = o['Tracking'] || '-';
        var carrier = o['Shipping Carrier'] || '';
        var orderId = o['Order ID'];
        var branch = (o['Branch'] || '').replace(/^สาขา\s*/i, '').trim();
        var dateFormatted = formatDate(o['Timestamp']);
        var actions = renderOrderActions(o);
        html += '<tr onclick="openOrderDetailModal(\'' + orderId + '\')" class="border-b border-slate-100 hover:bg-slate-50 transition cursor-pointer">' +
          '<td class="p-3 font-mono font-bold text-blue-700">' + orderId + '</td>' +
          '<td class="p-3 text-slate-600 text-xs">' + dateFormatted + '</td>' +
          '<td class="p-3 font-medium">' + branch + '</td>' +
          '<td class="p-3 min-w-[220px]">' + renderOrderItems(o['Items']) + '</td>' +
          '<td class="p-3 text-right font-bold">' + Number(o['Grand Total']).toLocaleString('th-TH',{minimumFractionDigits:2}) + '</td>' +
          '<td class="p-3 text-center whitespace-nowrap"><span class="status-pill px-2 py-1 rounded-full text-xs font-semibold ' + statusBadge(status) + '">' + escapeHtml(status) + '</span></td>' +
          '<td class="p-3 text-center text-xs text-slate-500">' + (carrier ? '<div class="font-bold text-slate-700">' + escapeHtml(carrier) + '</div>' : '') + escapeHtml(tracking) + '</td>' +
          '<td id="order-actions-' + cssSafeId(orderId) + '" class="p-3 text-center whitespace-nowrap">' + actions + '</td>' +
        '</tr>';
      }
      tbody.innerHTML = html;
      renderOrdersPagination(totalPages, pending.length, filteredOrders.length);
    }

    function compareOrdersNewestFirst(a, b) {
      var timeA = new Date(a['Timestamp'] || '').getTime();
      var timeB = new Date(b['Timestamp'] || '').getTime();
      if (!isFinite(timeA)) timeA = 0;
      if (!isFinite(timeB)) timeB = 0;
      if (timeA !== timeB) return timeB - timeA;
      return String(b['Order ID'] || '').localeCompare(String(a['Order ID'] || ''), undefined, { numeric: true });
    }

    function isOrderInProgress(status) {
      var text = String(status || '');
      return text.indexOf('เสร็จสิ้น') === -1 && text.indexOf('ยกเลิก') === -1;
    }

    function renderOrdersPagination(totalPages, pendingCount, totalCount) {
      var container = document.getElementById('orders-pagination');
      if (!container) return;
      if (!totalPages || totalPages <= 1) {
        container.innerHTML = '<span class="text-slate-400">แสดง ' + totalCount + ' รายการ</span>';
        return;
      }
      var html = '<span class="mr-2 text-slate-500">หน้า 1 รวมงานค้าง ' + pendingCount + ' รายการ</span>';
      html += '<button onclick="changeOrderPage(-1)" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200"' + (currentOrderPage <= 1 ? ' disabled' : '') + '>ก่อนหน้า</button>';
      for (var i = 1; i <= totalPages; i++) {
        html += '<button onclick="setOrderPage(' + i + ')" class="px-3 py-1.5 rounded-lg font-bold ' + (i === currentOrderPage ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200') + '">' + i + '</button>';
      }
      html += '<button onclick="changeOrderPage(1)" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200"' + (currentOrderPage >= totalPages ? ' disabled' : '') + '>ถัดไป</button>';
      container.innerHTML = html;
    }

    function setOrderPage(page) {
      currentOrderPage = page;
      renderOrders(allOrdersData);
    }

    function changeOrderPage(delta) {
      currentOrderPage += delta;
      renderOrders(allOrdersData);
    }

    function statusBadge(status) {
      if (status.indexOf('รอการยืนยัน') !== -1) return 'bg-yellow-100 text-yellow-700';
      if (status.indexOf('ตัดสต็อก') !== -1) return 'bg-blue-100 text-blue-700';
      if (status.indexOf('จัดส่ง') !== -1) return 'bg-purple-100 text-purple-700';
      if (status.indexOf('เสร็จสิ้น') !== -1) return 'bg-emerald-100 text-emerald-700';
      if (status.indexOf('ยกเลิก') !== -1) return 'bg-slate-200 text-slate-500';
      return 'bg-slate-100 text-slate-600';
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function thaiBahtText(value) {
      var numberText = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
      var positionText = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
      function readNumber(number) {
        number = String(parseInt(number, 10) || 0);
        if (number === '0') return 'ศูนย์';
        if (number.length > 6) {
          var head = number.slice(0, -6);
          var tail = number.slice(-6);
          var tailText = parseInt(tail, 10) ? readNumber(tail) : '';
          return readNumber(head) + 'ล้าน' + tailText;
        }
        var result = '';
        var len = number.length;
        for (var i = 0; i < len; i++) {
          var digit = Number(number.charAt(i));
          var pos = len - i - 1;
          if (!digit) continue;
          if (pos === 0 && digit === 1 && len > 1) {
            result += 'เอ็ด';
          } else if (pos === 1 && digit === 1) {
            result += 'สิบ';
            continue;
          } else if (pos === 1 && digit === 2) {
            result += 'ยี่';
          } else {
            result += numberText[digit];
          }
          result += positionText[pos];
        }
        return result;
      }
      var fixed = Math.round(Number(value || 0) * 100);
      var baht = Math.floor(fixed / 100);
      var satang = fixed % 100;
      var text = readNumber(baht) + 'บาท';
      text += satang ? readNumber(satang) + 'สตางค์' : 'ถ้วน';
      return text;
    }

    function excelDateSerial(date) {

    function fillReceiptSheetXml(xml, order, items, sheetName) {
      var orderId = order['Order ID'];
      var orderDate = new Date(order['Timestamp']);
      if (isNaN(orderDate.getTime())) orderDate = new Date();
      var customerName = order['CustomerName'] || order['Branch'] || '';
      var customerAddress = order['Branch'] || '';
      var isBillingSheet = sheetName === 'ต้นฉบับ(ใบวางบิล)';
      var billingSheetRef = "'ต้นฉบับ(ใบวางบิล)'!";
      var receiptSheetRef = "'ต้นฉบับ(ใบเสร็จรับเงิน)'!";
      var invoiceNumberText = 'ใบกำกับภาษีเลขที่ ' + orderId;

      xml = setCellText(xml, 'A7', 'ชื่อลูกค้า : ' + customerName);
      xml = isBillingSheet ? setCellText(xml, 'I7', orderId) : setCellFormula(xml, 'I7', sheetName === 'สำเนา(ใบเสร็จรับเงิน)' ? receiptSheetRef + 'I7' : billingSheetRef + 'I7', orderId, 'string');
      xml = setCellText(xml, 'A9', 'ที่อยู่ลูกค้า : ' + customerAddress);
      xml = isBillingSheet ? setCellNumber(xml, 'I9', excelDateSerial(orderDate)) : setCellFormula(xml, 'I9', sheetName === 'สำเนา(ใบเสร็จรับเงิน)' ? receiptSheetRef + 'I9' : billingSheetRef + 'I9', excelDateSerial(orderDate), 'number');
      xml = isBillingSheet ? setCellText(xml, 'A11', 'เลขประจำผู้เสียภาษีอากร : ') : setCellFormula(xml, 'A11', billingSheetRef + 'A11', 'เลขประจำผู้เสียภาษีอากร : ', 'string');
      xml = isBillingSheet ? setCellText(xml, 'H11', invoiceNumberText) : setCellFormula(xml, 'H11', sheetName === 'สำเนา(ใบเสร็จรับเงิน)' ? receiptSheetRef + 'H11' : billingSheetRef + 'H11', invoiceNumberText, 'string');

      for (var row = 14; row <= 27; row++) {
        xml = setCellBlank(xml, 'A' + row);
        xml = setCellBlank(xml, 'B' + row);
        xml = setCellBlank(xml, 'I' + row);
      }

      var maxRows = 14;
      var visibleItems = items.slice(0, maxRows);
      if (items.length > maxRows) {
        var rest = items.slice(maxRows - 1);
        visibleItems = items.slice(0, maxRows - 1);
        visibleItems.push({
          name: 'รายการสินค้าอื่น ๆ รวม ' + rest.length + ' รายการ',
          subtotal: rest.reduce(function(sum, item) { return sum + Number(item.subtotal || 0); }, 0)
        });
      }

      for (var i = 0; i < maxRows; i++) {
        var targetRow = 14 + i;
        var lineItem = visibleItems[i];
        if (isBillingSheet) {
          if (lineItem) {
            xml = setCellNumber(xml, 'A' + targetRow, i + 1);
            xml = setCellText(xml, 'B' + targetRow, lineItem.name);
            xml = setCellNumber(xml, 'I' + targetRow, lineItem.subtotal || 0);
          }
        } else {
          var hasLineItem = !!lineItem;
          xml = setCellFormula(xml, 'A' + targetRow, 'IF(' + billingSheetRef + 'B' + targetRow + '<>"",' + billingSheetRef + 'A' + targetRow + ',"")', hasLineItem ? i + 1 : '', hasLineItem ? 'number' : 'string');
          xml = setCellFormula(xml, 'B' + targetRow, 'IF(' + billingSheetRef + 'B' + targetRow + '<>"",' + billingSheetRef + 'B' + targetRow + ',"")', hasLineItem ? lineItem.name : '', 'string');
          xml = setCellFormula(xml, 'I' + targetRow, 'IF(' + billingSheetRef + 'B' + targetRow + '<>"",' + billingSheetRef + 'I' + targetRow + ',"")', hasLineItem ? Number(lineItem.subtotal || 0) : '', hasLineItem ? 'number' : 'string');
        }
      }

      var subtotal = visibleItems.reduce(function(sum, item) { return sum + Number(item.subtotal || 0); }, 0);
      var vat = subtotal * 0.07;
      var grandTotal = subtotal + vat;
      xml = setCellFormula(xml, 'I28', 'SUM(I14:I27)', subtotal, 'number');
      xml = setCellFormula(xml, 'I29', 'I28*7%', vat, 'number');
      xml = setCellFormula(xml, 'I30', 'SUM(I28:I29)', grandTotal, 'number');
      xml = setCellFormula(xml, 'A31', 'BAHTTEXT(I30)', thaiBahtText(grandTotal), 'string');
      return xml;
    }

    async function fillReceiptWorkbook(zip, order) {
      var items = buildReceiptItems(order);
      var sheetPaths = await getWorkbookSheetPaths(zip);
      await removeCalcChain(zip);
      await forceWorkbookRecalculation(zip);
      var targetSheets = ['ต้นฉบับ(ใบวางบิล)', 'ต้นฉบับ(ใบเสร็จรับเงิน)', 'สำเนา(ใบเสร็จรับเงิน)'];
      for (var i = 0; i < targetSheets.length; i++) {
        var path = sheetPaths[targetSheets[i]];
        var file = path && zip.file(path);
        if (!file) continue;
        var xml = await file.async('string');
        zip.file(path, fillReceiptSheetXml(xml, order, items, targetSheets[i]));
      }
    }

    async function generateReceiptExcel(orderId) {
      var order = getOrderForReceipt(orderId);
      if (!order) {
        alert('ไม่พบข้อมูลออเดอร์');
        return;
      }
      if (!window.JSZip) {
        alert('ยังโหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');
        return;
      }
      try {
        var zip = await JSZip.loadAsync(base64ToArrayBuffer(RECEIPT_TEMPLATE_BASE64));
        await fillReceiptWorkbook(zip, order);
        var buffer = await zip.generateAsync({
          type: 'arraybuffer',
          compression: 'DEFLATE',
          mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        });
        var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = getReceiptFilename(order);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('ออกใบเสร็จไม่สำเร็จ: ' + (err && err.message ? err.message : err));
      }
    }

    function flattenStockItems() {
      var rows = [];
      for (var i = 0; i < allStockData.length; i++) {
        var main = allStockData[i];
        rows.push(normalizeStockItem(main, false, main.productName || main.name, main.number, (main.children || []).length));
        if (stockSortMode) continue;
        if (collapsedStockGroups[main.number]) continue;
        var children = main.children || [];
        for (var j = 0; j < children.length; j++) {
          var child = children[j];
          child.productName = main.productName;
          child.category = child.category || main.category;
          rows.push(normalizeStockItem(child, true, child.choiceName || child.name || '', main.number, 0));
        }
      }
      return rows;
    }

    function normalizeStockItem(item, isChild, displayName, parentNumber, childCount) {
      return {
        number: item.number === null || item.number === undefined ? '' : String(item.number),
        name: displayName || item.productName || item.choiceName || item.name || '',
        productName: item.productName || item.name || '',
        choiceName: item.choiceName || '',
        category: item.category || '',
        price: Number(item.price || 0),
        stock: Number(item.stock || 0),
        lowStock: Number(item.lowStock || 0),
        awaitingShipment: Number(item.awaitingShipment || 0),
        status: item.status || '',
        pictureUrl: item.pictureUrl || '',
        productCode: item.productCode || '',
        isChild: isChild,
        parentNumber: parentNumber || '',
        childCount: childCount || 0,
        isStockTracked: item.isStockTracked !== false,
        _row: item._row
      };
    }

    function getStockItemByNumber(number) {

      var target = String(number);
      for (var i = 0; i < allStockData.length; i++) {
        var main = allStockData[i];
        if (String(main.number) === target) return main;
        var children = main.children || [];
        for (var j = 0; j < children.length; j++) {
          if (String(children[j].number) === target) return children[j];
        }
      }
      return null;
    }

    function renderStockTable() {
      var tbody = document.getElementById('stock-table-tbody');
      if (!tbody) return;
      var term = (document.getElementById('stock-search-input')?.value || '').trim().toLowerCase();
      var category = getSelectedStockCategory();
      if (stockView === 'cards') {
        renderStockViewShell();
        var cardView = document.getElementById('stock-card-view');
        var cardGroups = allStockData.filter(function(main) {
          var children = main.children || [];
          var groupItems = [main].concat(children);
          if (category && !groupItems.some(function(item) { return (item.category || main.category) === category; })) return false;
          if (!term) return true;
          return groupItems.some(function(item) {
            return (String(item.number || '') + ' ' + String(item.productName || item.name || '') + ' ' + String(item.choiceName || '') + ' ' + String(item.category || main.category || '') + ' ' + String(item.productCode || '')).toLowerCase().indexOf(term) !== -1;
          });
        });
        if (cardView) {
          cardView.innerHTML = cardGroups.length
            ? cardGroups.map(function(main) { return renderStockCard(normalizeStockItem(main, false, main.productName || main.name, main.number, (main.children || []).length)); }).join('')
            : '<div class="col-span-full text-center py-10 text-slate-400">ไม่มีสินค้า</div>';
        }
        return;
      }
      var rows = flattenStockItems().filter(function(item) {
        if (category && item.category !== category) return false;
        if (!term) return true;
        return (item.number + ' ' + item.name + ' ' + item.category + ' ' + item.productCode).toLowerCase().indexOf(term) !== -1;
      });

        renderStockViewShell();
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-slate-400">ไม่มีสินค้า</td></tr>';
